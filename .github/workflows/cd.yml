name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency: production-deploy

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production        # GitHub mein is environment pe approval laga sakte ho
    steps:
      - name: Server pe zero-downtime deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/serverquest
            git pull --ff-only
            ./scripts/deploy.sh
