# Reverse proxy + load balancer + security headers.
# Compose service names: frontend (port 80), backend (port 5000)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;

server {
  listen 80;
  server_name _;                     # yahan apna domain likho
  server_tokens off;                 # nginx version chhupao

  # Docker DNS: har 5s mein backend ke saare replica IPs dobara resolve
  # -> naya container aaya/gaya to nginx restart nahi chahiye, aur round-robin load balancing milti hai
  resolver 127.0.0.11 valid=5s ipv6=off;

  client_max_body_size 10k;          # bade payload reject
  client_body_timeout 10s;
  client_header_timeout 10s;
  limit_conn perip 30;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # HTTPS lagne ke baad ye line on karo:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }   # certbot ke liye
  location ~ /\. { deny all; }                                           # hidden files band
  location = /metrics { return 404; }                                    # metrics bahar nahi

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    set $be http://backend:5000;
    proxy_pass $be;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # client ka fake header overwrite
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503;   # ek replica gira to dusre pe bhejo
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  location / {
    set $fe http://frontend:80;
    proxy_pass $fe;
    proxy_set_header Host $host;
  }
}

