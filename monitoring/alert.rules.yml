groups:
  - name: serverquest
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Backend {{ $labels.instance }} down hai (/health fail)" }
      - alert: NoBackendTargets
        expr: absent(up{job="backend"})
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Koi bhi backend container nahi mil raha" }
      - alert: HighCPU
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100 > 90
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "CPU 90% se upar ({{ $value | printf \"%.0f\" }}%)" }
      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "RAM 90% se upar ({{ $value | printf \"%.0f\" }}%)" }
      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Disk 85% se upar bhar gayi" }
